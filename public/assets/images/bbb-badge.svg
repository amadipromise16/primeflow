<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="100%" height="100%">
  <!-- BBB Torch & Rating -->
  <rect x="10" y="14" width="36" height="36" rx="6" fill="#005A9C"/>
  <text x="28" y="38" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle">BBB</text>
  <!-- A+ Rating -->
  <text x="65" y="38" fill="#FFFFFF" font-family="'Arial Black', Impact, sans-serif" font-size="30" font-weight="900">A+</text>
  <rect x="65" y="44" width="75" height="18" rx="4" fill="#005A9C"/>
  <text x="102" y="57" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle">ACCREDITED</text>
  <text x="65" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Highest Rating</text>
</svg>